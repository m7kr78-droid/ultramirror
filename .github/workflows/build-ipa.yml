name: Build IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/build-ipa.yml"

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build unsigned IPA
        run: bash ios/UltraMirror/build-ipa.sh

      - uses: actions/upload-artifact@v4
        with:
          name: UltraMirror.ipa
          path: ios/UltraMirror/UltraMirror.ipa
